<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>skyeffectsworldtracking</title>
  <meta itemprop="name" content="skyeffectsworldtracking">
  <meta name="twitter:title" content="skyeffectsworldtracking">
  <meta property="og:title" content="skyeffectsworldtracking">
  <meta property="og:site_name" content="skyeffectsworldtracking">
  <meta name="description" content="">
  <meta itemprop="description" content="">
  <meta property="og:description" content="">
  <meta name="twitter:description" content="">
  <script crossorigin="anonymous" src="./external/scripts/8frame-1.4.1.min.js"></script>
  <script crossorigin="anonymous" src="./external/landing-page/landing-page.js"></script>
  <script crossorigin="anonymous" src="./external/xrextras/xrextras.js"></script>
  <script crossorigin="anonymous" src="./external/scripts/coaching-overlay.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam">
  </script>

<!-- head.html is optional; elements will be added to your html head before app.js is loaded. -->

<!-- Use "8thwall:" meta tags to hook into 8th Wall's build process and developer tools. -->
<meta name="8thwall:renderer" content="aframe:1.4.1"/>
<meta name="8thwall:package" content="@8thwall.landing-page"/>
<meta name="8thwall:package" content="@8thwall.xrextras"/> 
<meta name="8thwall:package" content="@8thwall.coaching-overlay"/>
 
<!-- Other external scripts and meta tags can also be added. -->
<script crossorigin="anonymous" src="./external/scripts/aframe-extras-6.1.1.min.js"></script>


</head>

<body>
<!-- Version switcher: add ?v=stamp to URL to test the flat stamp projection -->
<script>
  if (new URLSearchParams(location.search).get('v') === 'stamp') {
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelector('#skyBalloon').setAttribute('gltf-model', '#balloon-stamp')
    })
  }
</script>
<script src="bundle.js"></script>
<!-- Copyright (c) 2023 8th Wall, Inc. -->
<!-- body.html is optional; elements will be added to your html body after app.js is loaded. -->
<div id="orientationOverlay">
  <div id="message">
    <img src="./assets/rotate.svg" width="100px" />
    Please rotate the phone to portrait mode for a better experience.
  </div>
</div>

<!-- Directory modal -->
<div id="directoryModal">
  <div id="directorySign">
    <div id="directoryRoof"></div>
    <div id="directoryTitleBand"><span>Participating Businesses</span></div>
    <div id="directoryList">
      <!-- populated by JS from BUSINESSES array -->
    </div>
    <button id="directoryClose">&#x2715;</button>
  </div>
</div>

<!-- Business detail modal -->
<div id="detailModal">
  <div id="detailContent">
    <button id="detailBack">&#8592; Back</button>
    <div id="detailLogo"></div>
    <div id="detailAccent"></div>
    <h2 id="detailName"></h2>
    <p id="detailPrize"></p>
    <button id="detailClaim">Claim Prize</button>
  </div>
</div>

<div id="giftModal">
  <div id="giftModalContent">
    <button id="giftClose">&#x2715;</button>
    <h2>You've won a gift certificate from us!</h2>
    <p>Enter your email and we'll send it to you.</p>
    <input type="email" id="giftEmail" placeholder="your@email.com" />
    <button id="giftSubmit">Send My Gift</button>
    <p id="giftConfirm" style="display:none">Thanks! Check your inbox.</p>
  </div>
</div>

<a-scene
  xrextras-loading
  xrextras-runtime-error
  landing-page
  sky-coaching-overlay
  recenter
  renderer="colorManagement: false"
  xrconfig
  xrlayers
  xrweb
  device-orientation
  present-box>
  <a-assets>
    <!-- V3 Both: label on front + back faces (default) -->
    <a-asset-item id="balloon" src="./assets/models/balloon-both.glb"></a-asset-item>
    <!-- V1 Label: label on front face only — activated via ?v=label -->
    <a-asset-item id="balloon-label" src="./assets/models/balloon-label.glb"></a-asset-item>
    <!-- V2 Stamp: flat projection on front face — activated via ?v=stamp -->
    <a-asset-item id="balloon-stamp" src="./assets/models/balloon-stamp.glb"></a-asset-item>
    <a-asset-item id="present" src="./assets/models/present.glb"></a-asset-item>
    <a-asset-item id="present2" src="./assets/models/present2.glb"></a-asset-item>
  </a-assets>

  <!-- Sky Effects Scene -->
  <a-entity
    id="skyScene"
    xrlayerscene="name:sky; invertLayerMask:false; edgeSmoothness:0.6"
    hide-overlay>
    <!-- Sky Scene Hot Air Balloon -->
    <a-entity
      id="skyBalloon"
      gltf-model="#balloon"
      animate-balloon
      position="0 -7 -13"
      scale=".7 .7 .7"
      shadow>
    </a-entity>

    <!-- Ambient and Directional Light with shadows for the Sky Scene -->
    <a-entity light="type: ambient; intensity: 0.75;"></a-entity>
    <a-entity
      id="skyLight"
      light="
        type: directional;
        intensity: 0.8;
        castShadow: true;
        shadowMapHeight: 2048;
        shadowMapWidth: 2048;
        shadowCameraTop: 10;
        shadowCameraBottom: -10;
        shadowCameraRight: 10;
        shadowCameraLeft: -10;
        target: #skyBalloon;
        shadowRadius: 10;"
      position="1 4.3 2.5"
      xrextras-attach="target: skyBalloon; offset: 8 8 4"
      shadow>
    </a-entity>
  </a-entity>

  <!-- World Effects Scene -->

  <!-- Scene Camera for Sky Effects and World Effects Scenes -->
  <a-camera id="camera" wasd-controls-enabled="false" position="0 3 0">
    <a-entity cursor="fuse: false; rayOrigin: mouse"
              raycaster="objects: .clickable; far: 100"></a-entity>
  </a-camera>

  <!-- Ambient and Directional Light with shadows for the World Scene (consistent with sky scene lighting) -->
  <a-entity light="type: ambient; intensity: 0.75;"></a-entity>
  <a-entity
    id="light"
    light="
      type: directional;
      intensity: 0.8;
      castShadow: true;
      shadowMapHeight: 2048;
      shadowMapWidth: 2048;
      shadowCameraTop: 10;
      shadowCameraBottom: -10;
      shadowCameraRight: 10;
      shadowCameraLeft: -10;
      target: #camera;
      shadowRadius: 10;"
    position="1 4.3 2.5"
    xrextras-attach="target: camera; offset: 8 8 4"
    shadow>
  </a-entity>

  <!-- Ground Plane to catch shadows -->
  <a-box
    id="ground"
    scale="2000 2 2000"
    position="0 -1 0"
    material="shader: shadow; transparent: true; opacity: 0.4"
    shadow>
  </a-box>
</a-scene>

<script>
  // ── Business data ──────────────────────────────────────────────────────────
  const BUSINESSES = [
    { name: 'Human-I-T',    prize: 'Get Involved!',        color: '#D72638', logo: 'assets/logos/human.png'   },
    { name: 'Good Cakes AND Bakes',   prize: 'Free Cupcake w/ any purchase!', color: '#1a3a6b', logo: 'assets/logos/good.png' },
    { name: 'Sherwood Art Gallery', prize: '50% Off Select Frames!',     color: '#2a7d4b', logo: ''      },
    { name: 'Kuzzos Chicken&Waffles',       prize: 'Free Small Fries!',   color: '#c47a00', logo: 'assets/logos/kuzzo.png' },
  ]

  // ── Directory helpers ──────────────────────────────────────────────────────
  function showDirectory() {
    // Populate rows (idempotent — rebuild each time in case data changes)
    const list = document.getElementById('directoryList')
    list.innerHTML = ''
    BUSINESSES.forEach((biz, i) => {
      const row = document.createElement('div')
      row.className = 'bizRow'
      row.style.background = biz.color

      const logoBox = document.createElement('div')
      logoBox.className = 'bizLogo'
      const img = document.createElement('img')
      img.src = biz.logo
      img.alt = biz.name
      img.onerror = function () {
        this.style.display = 'none'
        logoBox.textContent = biz.name.charAt(0)
      }
      logoBox.appendChild(img)

      const nameEl = document.createElement('span')
      nameEl.className = 'bizName'
      nameEl.textContent = biz.name

      const chevron = document.createElement('span')
      chevron.className = 'bizChevron'
      chevron.textContent = '›'

      row.appendChild(logoBox)
      row.appendChild(nameEl)
      row.appendChild(chevron)
      row.addEventListener('click', () => showDetail(i))
      list.appendChild(row)
    })

    document.getElementById('directoryModal').style.display = 'flex'
  }

  function showDetail(index) {
    const biz = BUSINESSES[index]

    // Logo
    const logoEl = document.getElementById('detailLogo')
    logoEl.innerHTML = ''
    const img = document.createElement('img')
    img.src = biz.logo
    img.alt = biz.name
    img.onerror = function () {
      this.style.display = 'none'
      logoEl.textContent = biz.name.charAt(0)
    }
    logoEl.appendChild(img)

    document.getElementById('detailAccent').style.background = biz.color
    document.getElementById('detailName').textContent = biz.name
    document.getElementById('detailPrize').textContent = biz.prize

    document.getElementById('directoryModal').style.display = 'none'
    document.getElementById('detailModal').style.display = 'flex'
  }

  // ── Directory / detail wiring ──────────────────────────────────────────────
  document.getElementById('directoryClose').addEventListener('click', () => {
    document.getElementById('directoryModal').style.display = 'none'
  })

  document.getElementById('detailBack').addEventListener('click', () => {
    document.getElementById('detailModal').style.display = 'none'
    document.getElementById('directoryModal').style.display = 'flex'
  })

  document.getElementById('detailClaim').addEventListener('click', () => {
    document.getElementById('detailModal').style.display = 'none'
    // Reset gift modal state in case it was used before
    document.getElementById('giftConfirm').style.display = 'none'
    document.getElementById('giftSubmit').style.display = ''
    document.getElementById('giftEmail').value = ''
    document.getElementById('giftModal').style.display = 'flex'
  })

  // ── Gift modal wiring ──────────────────────────────────────────────────────
  document.getElementById('giftClose').addEventListener('click', () => {
    document.getElementById('giftModal').style.display = 'none'
  })
  document.getElementById('giftSubmit').addEventListener('click', () => {
    const email = document.getElementById('giftEmail').value
    if (email) {
      document.getElementById('giftConfirm').style.display = 'block'
      document.getElementById('giftSubmit').style.display = 'none'
      // TODO: wire up actual email delivery endpoint
      console.log('Gift certificate email:', email)
    }
  })
</script>

</body>

</html>
